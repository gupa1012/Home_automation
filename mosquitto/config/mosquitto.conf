# Mosquitto MQTT Broker Konfiguration
# Dokumentation: https://mosquitto.org/man/mosquitto-conf-5.html

# Standard-Listener auf Port 1883 (nur lokales Netzwerk)
listener 1883 0.0.0.0
protocol mqtt

# WebSocket-Listener für Browser-Clients
listener 9001
protocol websockets

# Authentifizierung (Passwortdatei)
# Erstellen: mosquitto_passwd -c /mosquitto/config/passwd ha_mqtt
password_file /mosquitto/config/passwd

# Keine anonymen Verbindungen
allow_anonymous false

# Persistenz
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Verbindungs-Limits
max_connections 100
max_keepalive 60
