##############################################################
# packages/sma_solar.yaml
# SMA Wechselrichter und Sunny Home Manager 2.0
#
# Voraussetzung:
#   SMA-Integration über UI einrichten:
#   Einstellungen → Integrationen → SMA Solar hinzufügen
#   Host: IP-Adresse des Wechselrichters
#   Passwort: SMA WebConnect Passwort (Standard: 0000 oder 1111)
#
# Sunny Home Manager 2.0:
#   Einstellungen → Integrationen → SMA Sunny Home Manager 2.0
#   oder via MQTT (wenn in SHM aktiviert)
##############################################################

# Sensor-Gruppen
group:
  solar_sensoren:
    name: "Solar Sensoren"
    entities:
      - sensor.sma_power_ac
      - sensor.sma_power_feedin
      - sensor.sma_power_drawfrom
      - sensor.sma_total_yield_today
      - sensor.sma_total_yield

# Energie-Dashboard Konfiguration
# (Muss unter Einstellungen → Energie manuell eingestellt werden,
#  oder via configuration.yaml – ab HA 2021.8)
energy:
  solar_production:
    - stat_energy_from: sensor.sma_total_yield

# Template-Sensoren: abgeleitete Werte
template:
  - sensor:
      - name: "Solar – Aktuelle Leistung (kW)"
        unique_id: solar_power_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {{ (states('sensor.sma_power_ac') | float(0) / 1000) | round(2) }}

      - name: "Solar – Eigenverbrauchsquote"
        unique_id: solar_self_consumption_ratio
        unit_of_measurement: "%"
        icon: mdi:percent
        state: >
          {% set gen = states('sensor.sma_power_ac') | float(0) %}
          {% set feed = states('sensor.sma_power_feedin') | float(0) %}
          {% if gen > 0 %}
            {{ (((gen - feed) / gen) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Solar – Autarkiequote"
        unique_id: solar_autarky_ratio
        unit_of_measurement: "%"
        icon: mdi:home-battery
        state: >
          {% set gen = states('sensor.sma_power_ac') | float(0) %}
          {% set draw = states('sensor.sma_power_drawfrom') | float(0) %}
          {% set consumption = gen + draw %}
          {% if consumption > 0 %}
            {{ ((gen / consumption) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Solar – Überschuss (W)"
        unique_id: solar_surplus_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower-export
        state: >
          {{ [states('sensor.sma_power_feedin') | float(0), 0] | max | round(0) }}

# Statistik-Sensoren für Langzeiterfassung
# Hinweis: Die SMA-Integration liefert je nach Gerät unterschiedliche Entity-Namen.
# Die tatsächlichen Namen findest du unter Einstellungen → Integrationen → SMA → Entitäten.
# Häufig verwendete Namen: sensor.sma_total_yield, sensor.sma_metering_total_yield usw.
# Passe die source-Angaben bei Bedarf an die tatsächlichen Entity-Namen an.
utility_meter:
  solar_yield_daily:
    name: "Solar Tagesertrag"
    source: sensor.sma_total_yield
    cycle: daily
  solar_yield_monthly:
    name: "Solar Monatsertrag"
    source: sensor.sma_total_yield
    cycle: monthly
  grid_feedin_daily:
    name: "Einspeisung täglich"
    # sensor.sma_metering_total_yield oder sensor.sma_total_yield_today je nach Gerät
    source: sensor.sma_metering_total_yield
    cycle: daily
  grid_drawfrom_daily:
    name: "Netzbezug täglich"
    # sensor.sma_metering_total_absorbed oder äquivalenter SMA-Sensor
    source: sensor.sma_metering_total_absorbed
    cycle: daily
